<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Slopscan</title>
    <link rel="stylesheet" href="../base.css" />
    <style>
      .tabrow { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
      .counts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
      .count { border: 1px solid var(--line); border-radius: 5px; padding: 8px 12px; background: #101315; min-width: 96px; }
      .count b { display: block; font: 700 19px/1.2 var(--mono); }
      .count span { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--dim); font-weight: 700; }
      .count.bad b { color: var(--bad); }
      .count.ok b { color: var(--ok); }
      .where { font-family: var(--mono); font-size: 11px; color: var(--dim); word-break: break-all; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="index.js"></script>
  </body>
</html>
